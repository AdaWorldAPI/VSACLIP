[package]
name = "vsaclip"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "HDR POPCNT Sweep — Visual recognition via Hamming resonance on ladybug-rs Containers"
repository = "https://github.com/AdaWorldAPI/VSACLIP"
authors = ["Jan Hübener", "Ada Consciousness Project"]
keywords = ["vsa", "clip", "hamming", "simd", "resonance", "hdr", "popcnt"]

[lib]
name = "vsaclip"

[[bin]]
name = "vsaclip-proof"
path = "src/bin/proof.rs"

[[bin]]
name = "vsaclip-bench"
path = "src/bin/bench.rs"

[[bin]]
name = "poc"
path = "src/bin/poc.rs"

[[bin]]
name = "download-data"
path = "src/bin/download_data.rs"

[[bin]]
name = "xtrans-experiment"
path = "src/bin/xtrans_experiment.rs"

[[bin]]
name = "thirds-experiment"
path = "src/bin/thirds_experiment.rs"

[[bin]]
name = "cogrecord8k-experiment"
path = "src/bin/cogrecord8k_experiment.rs"

# =============================================================================
# FEATURES
# =============================================================================
[features]
default = ["simd", "rustynum"]
simd = []
rustynum = ["dep:rustynum-rs", "dep:rustynum-core"]
lance-io = ["dep:rustynum-arrow", "dep:tokio", "rustynum-arrow/lance", "rustynum-arrow/arrow", "rustynum"]
datafusion-scan = ["dep:rustynum-arrow", "dep:arrow", "rustynum-arrow/datafusion", "rustynum-arrow/arrow", "rustynum"]
fastembed = ["dep:fastembed"]
load-image = ["dep:image"]

# =============================================================================
# DEPENDENCIES
# =============================================================================
[dependencies]
ladybug-contract = { path = "/home/user/ladybug-rs/crates/ladybug-contract" }
rustynum-rs = { path = "/home/user/rustynum/rustynum-rs", default-features = false, optional = true }
rustynum-core = { path = "/home/user/rustynum/rustynum-core", default-features = false, optional = true }
rustynum-arrow = { path = "/home/user/rustynum/rustynum-arrow", default-features = false, optional = true }
arrow = { version = "57", optional = true, default-features = false, features = ["ffi"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

fastembed = { version = "4", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png"] }

rand = "0.8"
rayon = "1"

# Async runtime for Lance I/O
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "hdr_sweep"
harness = false
